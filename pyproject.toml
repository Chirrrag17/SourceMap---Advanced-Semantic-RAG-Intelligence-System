[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "codebase-context-engine"
version = "0.1.0"
description = "SourceMap backend prototype for indexing and searching code repositories"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
api = ["fastapi>=0.110", "uvicorn[standard]>=0.27", "pydantic>=2.6", "python-dotenv>=1.0"]
ai = ["openai>=1.30", "langgraph>=0.2", "typing-extensions>=4.9"]
vector = ["pinecone>=5.0", "openai>=1.30"]
parser = ["tree-sitter-language-pack>=0.9"]
worker = ["celery[redis]>=5.3", "redis>=5.0"]
postgres = ["psycopg[binary]>=3.1"]
dev = ["pytest>=8.0", "httpx>=0.27"]

[project.scripts]
sourcemap = "codebase_context.cli:main"

[tool.setuptools.packages.find]
include = ["codebase_context*", "sourcemap*"]
